<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<ui:composition template="/WEB-INF/templates/public.xhtml">
  <ui:define name="title">Choose a new password</ui:define>
  <ui:define name="content">
    <f:metadata>
      <f:viewParam name="token" value="#{resetPassword.token}" />
      <f:viewAction action="#{resetPassword.onLoad()}" />
    </f:metadata>
    <h2>Choose a new password</h2>
    <p class="sub">Your reset link is single-use and expires after 30 minutes.</p>
    <h:messages globalOnly="true" infoClass="alert alert--info" warnClass="alert alert--warning"
                errorClass="alert alert--error" fatalClass="alert alert--error" styleClass="messages" />
    <h:form id="resetForm" rendered="#{resetPassword.validToken}">
      <div class="field" style="margin-bottom: 12px;">
        <label for="password" class="req">New password</label>
        <h:inputSecret id="password" value="#{resetPassword.newPassword}" styleClass="input" required="true"
                       requiredMessage="New password is required." maxlength="128" />
        <h:message for="password" styleClass="field-error" />
        <div class="help">At least 10 characters with an uppercase letter, a lowercase letter, and a digit.</div>
      </div>
      <div class="field" style="margin-bottom: 18px;">
        <label for="confirm" class="req">Confirm new password</label>
        <h:inputSecret id="confirm" value="#{resetPassword.confirmPassword}" styleClass="input" required="true"
                       requiredMessage="Please repeat the new password." maxlength="128" />
        <h:message for="confirm" styleClass="field-error" />
      </div>
      <h:commandButton value="Set new password" action="#{resetPassword.reset()}"
                       styleClass="btn btn--primary btn--lg btn--block" />
    </h:form>
    <div class="auth-links">
      <a href="#{request.contextPath}/login.xhtml">Back to sign in</a>
    </div>
  </ui:define>
</ui:composition>
</html>
