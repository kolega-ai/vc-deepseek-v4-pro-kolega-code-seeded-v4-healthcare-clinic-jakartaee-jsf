# ---------------------------------------------------------------------
# One-command local setup: `docker compose up`
#  1. db      - local PostgreSQL (no external services)
#  2. migrate - Flyway schema migrations + reference seed data
#  3. app     - WildFly with the clinic portal (runs its own demo seed on first boot)
# ---------------------------------------------------------------------
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinic
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: flyway/flyway:10.20.1
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    command: >-
      -url=jdbc:postgresql://db:5432/clinic
      -user=clinic
      -password=clinic_dev_password
      -connectRetries=60
      -locations=filesystem:/flyway/sql
      migrate
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    environment:
      # Datasource (consumed by WildFly's ClinicDS via ${env.*} expressions)
      DB_URL: jdbc:postgresql://db:5432/clinic
      DB_USER: clinic
      DB_PASSWORD: clinic_dev_password
      # Runtime data (uploads / exports / imports) on a local volume
      CLINIC_DATA_DIR: /opt/clinic-data
      # Decision-tier token signing secret and core-mock credential.
      # Local dev defaults - rotate in any real deployment.
      DECISION_TOKEN_SECRET: dev-only-decision-secret-change-me-4f3d2c1a
      CORE_MOCK_API_KEY: core-mock-local-key-9a7b6c5d
      CLINIC_BASE_URL: http://localhost:8080/clinic-portal
      JSF_PROJECT_STAGE: Development
      JAVA_OPTS_APPEND: -Xms128m -Xmx768m
    ports:
      - "${CLINIC_PORT:-8080}:8080"
    volumes:
      - clinicdata:/opt/clinic-data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/clinic-portal/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  pgdata:
  clinicdata:
